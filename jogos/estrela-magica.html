<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estrela Mágica — Soma 26</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f4f8;margin:0;color:#172033}
.wrap{max-width:760px;margin:auto;padding:22px}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 18px #0001}
h1{text-align:center}.q{font-size:23px;font-weight:bold;line-height:1.4}
button{width:100%;padding:15px;margin:8px 0;border:0;border-radius:12px;background:#e8edf5;font-size:18px;cursor:pointer}
#next,#restart{background:#315efb;color:white}.small{text-align:center;color:#667085}
.progress{height:10px;background:#e7eaf0;border-radius:20px;overflow:hidden;margin:16px 0}
.bar{height:100%;background:#315efb;width:0}.hidden{display:none}
</style></head><body><div class="wrap"><div class="card">
<h1>Estrela Mágica — Soma 26</h1>
<p class="small" id="counter"></p><div class="progress"><div class="bar" id="bar"></div></div>
<div id="game"><div class="q" id="q"></div><div id="options"></div>
<button id="next" class="hidden">Próxima questão</button></div>
<div id="result" class="hidden"></div>
</div></div>
<script>
const original=[{"q": "Uma linha da estrela contém 7, 8 e □. Qual número completa a soma 26?", "opts": ["9", "10", "12", "13"], "ans": "11"}, {"q": "Uma linha da estrela contém 5, 9 e □. Qual número completa a soma 26?", "opts": ["10", "11", "13", "14"], "ans": "12"}, {"q": "Uma linha da estrela contém 6, 13 e □. Qual número completa a soma 26?", "opts": ["5", "6", "8", "9"], "ans": "7"}, {"q": "Uma linha da estrela contém 4, 15 e □. Qual número completa a soma 26?", "opts": ["5", "6", "8", "9"], "ans": "7"}, {"q": "Uma linha da estrela contém 10, 3 e □. Qual número completa a soma 26?", "opts": ["11", "12", "14", "15"], "ans": "13"}, {"q": "Uma linha da estrela contém 11, 6 e □. Qual número completa a soma 26?", "opts": ["7", "8", "10", "11"], "ans": "9"}, {"q": "Uma linha da estrela contém 2, 14 e □. Qual número completa a soma 26?", "opts": ["8", "9", "11", "12"], "ans": "10"}, {"q": "Uma linha da estrela contém 12, 5 e □. Qual número completa a soma 26?", "opts": ["7", "8", "10", "11"], "ans": "9"}, {"q": "Uma linha da estrela contém 3, 11 e □. Qual número completa a soma 26?", "opts": ["10", "11", "13", "14"], "ans": "12"}, {"q": "Uma linha da estrela contém 8, 4 e □. Qual número completa a soma 26?", "opts": ["12", "13", "15", "16"], "ans": "14"}, {"q": "Uma linha da estrela contém 1, 16 e □. Qual número completa a soma 26?", "opts": ["7", "8", "10", "11"], "ans": "9"}, {"q": "Uma linha da estrela contém 13, 2 e □. Qual número completa a soma 26?", "opts": ["9", "10", "12", "13"], "ans": "11"}, {"q": "Uma linha da estrela contém 9, 7 e □. Qual número completa a soma 26?", "opts": ["8", "9", "11", "12"], "ans": "10"}, {"q": "Uma linha da estrela contém 14, 5 e □. Qual número completa a soma 26?", "opts": ["5", "6", "8", "9"], "ans": "7"}, {"q": "Uma linha da estrela contém 15, 4 e □. Qual número completa a soma 26?", "opts": ["5", "6", "8", "9"], "ans": "7"}, {"q": "Uma linha da estrela contém 16, 3 e □. Qual número completa a soma 26?", "opts": ["5", "6", "8", "9"], "ans": "7"}, {"q": "Uma linha da estrela contém 17, 2 e □. Qual número completa a soma 26?", "opts": ["5", "6", "8", "9"], "ans": "7"}, {"q": "Uma linha da estrela contém 18, 1 e □. Qual número completa a soma 26?", "opts": ["5", "6", "8", "9"], "ans": "7"}, {"q": "Uma linha da estrela contém 6, 6 e □. Qual número completa a soma 26?", "opts": ["12", "13", "15", "16"], "ans": "14"}, {"q": "Uma linha da estrela contém 10, 10 e □. Qual número completa a soma 26?", "opts": ["4", "5", "7", "8"], "ans": "6"}];
let questions=[],current=0,score=0,answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){
 questions=shuffle(original.map(x=>({...x,opts:shuffle([...x.opts])})));
 current=0;score=0;
 document.getElementById('game').classList.remove('hidden');
 document.getElementById('result').classList.add('hidden');show();
}
function show(){
 answered=false;let x=questions[current];
 document.getElementById('counter').textContent=`Questão ${current+1} de 20`;
 document.getElementById('bar').style.width=(current/20*100)+'%';
 document.getElementById('q').textContent=x.q;
 let box=document.getElementById('options');box.innerHTML='';
 x.opts.forEach(o=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(b,o);box.appendChild(b)});
 document.getElementById('next').classList.add('hidden');
}
function answer(btn,value){
 if(answered)return;answered=true;let x=questions[current];
 document.querySelectorAll('#options button').forEach(b=>b.disabled=true);
 if(value===x.ans){score++;btn.style.background='#b7efc5'}
 else{btn.style.background='#ffc2c2';document.querySelectorAll('#options button').forEach(b=>{if(b.textContent===x.ans)b.style.background='#b7efc5'})}
 document.getElementById('next').classList.remove('hidden');
}
document.getElementById('next').onclick=()=>{current++;if(current<20)show();else finish()};
function finish(){
 document.getElementById('game').classList.add('hidden');
 document.getElementById('bar').style.width='100%';
 let pct=score*5;
 let r=document.getElementById('result');r.classList.remove('hidden');
 let gabarito=questions.map((x,i)=>`${i+1}. ${x.ans}`).join(' &nbsp; | &nbsp; ');
 r.innerHTML=`<h2>Resultado final</h2><p><strong>Pontuação: ${score} de 20</strong></p>
 <p><strong>Aproveitamento: ${pct}%</strong></p><hr><p><strong>Gabarito da partida</strong></p><p>${gabarito}</p>
 <p>As perguntas são embaralhadas novamente a cada partida.</p><button id="restart">Jogar novamente</button>`;
 document.getElementById('restart').onclick=newGame;
}
newGame();
</script></body></html>
