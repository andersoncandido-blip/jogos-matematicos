<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Sequências, PA e PG</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#f2f5fb;color:#20283a;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto}.card{background:white;border-radius:22px;padding:22px;margin:0 0 18px;box-shadow:0 5px 22px #20305010}header,.center{text-align:center}h1{font-size:26px;margin:0 0 10px}.sub{font-size:18px;line-height:1.5;color:#687386;margin:0}.meta{display:flex;justify-content:space-between;color:#687386;font-size:14px}.bar{height:9px;background:#e9edf5;border-radius:20px;margin:16px 0;overflow:hidden}.bar>div{height:100%;background:#3158c9;width:0}.question{font-size:21px;line-height:1.4;font-weight:bold;margin:12px 0 20px}.option{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:white;border:1.5px solid #dce2ec;border-radius:14px;padding:14px;margin:10px 0;font-size:17px;color:#20283a;cursor:pointer}.option.sel{border-color:#3158c9;background:#f1f4ff}.letter{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:50%;background:#eef2fb;color:#3158c9;font-weight:bold}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}button.action{border:0;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:bold;cursor:pointer}.primary{background:#3158c9;color:white}.secondary{background:#edf0f6;color:#20283a}button:disabled{opacity:.4;cursor:not-allowed}.hidden{display:none!important}.score{font-size:42px;font-weight:800;color:#3158c9;margin:18px 0}.pills{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:16px 0}.pill{padding:13px 18px;border-radius:16px;font-size:17px;font-weight:bold}.good{background:#eaf6ef;color:#218653}.bad{background:#fff0f0;color:#c94b50}.neutral{background:#eef1f7}h2{font-size:25px;margin:28px 0 18px}.review{border:1px solid #e0e4eb;border-radius:16px;padding:16px;margin:14px 0}.review h3{font-size:18px;line-height:1.35;margin:0 0 14px}.status{font-weight:bold;font-size:17px;margin:8px 0 16px}.ok{color:#218653}.no{color:#c94b50}.review p{font-size:16px;line-height:1.5;margin:10px 0}.explain{color:#687386}@media(max-width:520px){.card{padding:20px 18px}.question{font-size:20px}.option{font-size:16px}.score{font-size:38px}}
</style></head><body><div class="wrap">
<header class="card"><h1>Quiz de Matemática</h1><p class="sub">Revisão: Sequências Numéricas, Progressão Aritmética (PA) e Progressão Geométrica (PG)<br>16 questões • 4 alternativas • Resultado somente ao final</p></header>
<main id="game" class="card"><div class="meta"><span id="counter"></span><span id="answered"></span></div><div class="bar"><div id="progress"></div></div><div id="question" class="question"></div><div id="options"></div><div class="actions"><button id="back" class="action secondary">Anterior</button><button id="next" class="action primary" disabled>Avançar</button></div></main>
<section id="result" class="card hidden"><div class="center"><h1>Resultado final</h1><p class="sub">Confira seu desempenho na revisão.</p><div id="score" class="score"></div><div class="pills"><span id="hits" class="pill good"></span><span id="misses" class="pill bad"></span></div><div class="pills"><span id="percent" class="pill neutral"></span></div></div><h2>Correção das questões</h2><div id="corrections"></div><div class="center"><button id="restart" class="action primary">Jogar novamente</button></div></section></div>
<script>
const questions=[["Observe a sequência numérica: 3, 6, 9, 12, 15, ... Qual é o próximo número?", ["20", "17", "18", "16"], 2, "A sequência aumenta de 3 em 3. Portanto, 15 + 3 = 18."], ["Na sequência 2, 4, 8, 16, 32, ... qual é o próximo termo?", ["48", "64", "56", "36"], 1, "Cada termo é obtido multiplicando o anterior por 2: 32 × 2 = 64."], ["Qual das sequências abaixo é crescente?", ["20, 17, 14, 11, ...", "5, 10, 15, 20, ...", "30, 25, 20, 15, ...", "8, 8, 8, 8, ..."], 1, "Na sequência 5, 10, 15, 20, ... os termos aumentam continuamente."], ["Na sequência 1, 4, 7, 10, 13, ... qual é a razão?", ["2", "4", "3", "5"], 2, "A diferença entre termos consecutivos é 3: 4 − 1 = 3."], ["O que caracteriza uma Progressão Aritmética (PA)?", ["A multiplicação por um mesmo número", "A soma de uma mesma quantidade a cada termo", "A alternância entre números pares e ímpares", "A divisão por números consecutivos"], 1, "Em uma PA, a diferença entre termos consecutivos é constante. Essa diferença é a razão."], ["Na PA (5, 9, 13, 17, ...), qual é o sexto termo?", ["25", "27", "29", "21"], 2, "A razão é 4. Contando os termos: 5, 9, 13, 17, 21, 25. O sexto termo é 25."], ["Qual é a razão da PA (18, 14, 10, 6, ...)?", ["4", "−2", "−4", "−6"], 2, "A razão é 14 − 18 = −4."], ["Qual é o décimo termo da PA cujo primeiro termo é 2 e a razão é 3?", ["27", "29", "30", "32"], 1, "aₙ = a₁ + (n − 1)r. Assim, a₁₀ = 2 + 9 × 3 = 29."], ["Em uma PA, o primeiro termo é 7 e a razão é 5. Qual é o termo geral?", ["aₙ = 7 + 5n", "aₙ = 7 + 5(n − 1)", "aₙ = 5 + 7(n − 1)", "aₙ = 7 × 5(n − 1)"], 1, "Usando aₙ = a₁ + (n − 1)r, temos aₙ = 7 + 5(n − 1)."], ["Qual é o quinto termo da PA (20, 17, 14, 11, ...)?", ["8", "6", "5", "9"], 0, "A razão é −3. O quinto termo é 11 − 3 = 8."], ["O que caracteriza uma Progressão Geométrica (PG)?", ["A adição de uma mesma quantidade", "A subtração de números pares", "A multiplicação por uma mesma razão", "A soma dos termos anteriores"], 2, "Em uma PG, cada termo é obtido multiplicando o anterior por uma razão constante."], ["Na PG (3, 6, 12, 24, ...), qual é a razão?", ["2", "3", "4", "6"], 0, "A razão é o quociente entre termos consecutivos: 6 ÷ 3 = 2."], ["Qual é o sexto termo da PG (2, 6, 18, 54, ...)?", ["162", "324", "486", "108"], 2, "A razão é 3: 2, 6, 18, 54, 162, 486. O sexto termo é 486."], ["Uma PG tem primeiro termo 5 e razão 2. Qual é o quarto termo?", ["20", "30", "40", "80"], 2, "Os termos são 5, 10, 20, 40. O quarto termo é 40."], ["Qual é o termo geral de uma PG com primeiro termo 3 e razão 2?", ["aₙ = 3 + 2(n − 1)", "aₙ = 3 × 2ⁿ", "aₙ = 3 × 2⁽ⁿ⁻¹⁾", "aₙ = 2 × 3⁽ⁿ⁻¹⁾"], 2, "O termo geral é aₙ = a₁ × q⁽ⁿ⁻¹⁾. Substituindo, aₙ = 3 × 2⁽ⁿ⁻¹⁾."], ["Uma população de bactérias dobra a cada hora. Se inicialmente há 100 bactérias, quantas haverá após 3 horas?", ["300", "400", "600", "800"], 3, "A quantidade dobra a cada hora: 100 → 200 → 400 → 800."]];let current=0,answers=Array(questions.length).fill(null),letters=["A","B","C","D"];const $=id=>document.getElementById(id);
function render(){let q=questions[current];$("counter").textContent=`Questão ${current+1} de ${questions.length}`;$("answered").textContent=`Respondidas: ${answers.filter(x=>x!==null).length}/${questions.length}`;$("progress").style.width=`${current/questions.length*100}%`;$("question").textContent=q[0];$("options").innerHTML="";q[1].forEach((v,i)=>{let b=document.createElement("button");b.className="option"+(answers[current]===i?" sel":"");let l=document.createElement("span");l.className="letter";l.textContent=letters[i];let t=document.createElement("span");t.textContent=v;b.append(l,t);b.onclick=()=>{answers[current]=i;render()};$("options").append(b)});$("back").disabled=current===0;$("next").textContent=current===questions.length-1?"Finalizar quiz":"Avançar";$("next").disabled=answers[current]===null}
function finish(){let hits=questions.reduce((n,q,i)=>n+(answers[i]===q[2]?1:0),0),misses=questions.length-hits,pct=Math.round(hits/questions.length*100);$("game").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=`${hits} de ${questions.length} pontos`;$("hits").textContent=`Acertos: ${hits}`;$("misses").textContent=`Erros: ${misses}`;$("percent").textContent=`Aproveitamento: ${pct}%`;$("corrections").innerHTML="";questions.forEach((q,i)=>{let ok=answers[i]===q[2],a=document.createElement("article");a.className="review";let h=document.createElement("h3");h.textContent=`${i+1}. ${q[0]}`;let s=document.createElement("div");s.className="status "+(ok?"ok":"no");s.textContent=ok?"✓ Acertou":"✕ Errou";let p1=document.createElement("p");p1.textContent=`Sua resposta: ${answers[i]===null?"Não respondida":letters[answers[i]]+". "+q[1][answers[i]]}`;let p2=document.createElement("p");p2.textContent=`Resposta correta: ${letters[q[2]]}. ${q[1][q[2]]}`;let p3=document.createElement("p");p3.className="explain";p3.textContent=q[3];a.append(h,s,p1,p2,p3);$("corrections").append(a)});window.scrollTo({top:0,behavior:"smooth"})}
$("back").onclick=()=>{if(current>0){current--;render()}};$("next").onclick=()=>{if(answers[current]===null)return;if(current<questions.length-1){current++;render()}else finish()};$("restart").onclick=()=>{current=0;answers=Array(questions.length).fill(null);$("result").classList.add("hidden");$("game").classList.remove("hidden");render();window.scrollTo({top:0,behavior:"smooth"})};render();
</script></body></html>
